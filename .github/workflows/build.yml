name: Build toolbox tool
run-name: "Build ${{ inputs.build }}${{ inputs.prepare_only && ' (prepare only)' || '' }}"
# Deliberately no push, pull_request, release, tag or schedule triggers.
on:
  workflow_dispatch:
    inputs:
      build:
        description: Select a supported tool / target combination
        required: true
        default: btop / entware-aarch64
        type: choice
        options:
          - btop / entware-aarch64
          - btop / entware-armv7
          - busybox / windows-amd64
          - cryptomator / android-arm64
          - John the Ripper / linux-amd64
          - librera / android-arm64
          - mupdf / linux-amd64
          - mupdf / android-arm64
          - nginx / entware-aarch64
          - nginx / entware-armv7
          - vaultwarden / entware-aarch64
          - vaultwarden / entware-armv7
          - vaultwarden / linux-amd64
          - vaultwarden / linux-arm64
          - vaultwarden / linux-armv7
          - wireguard / linux-amd64
          - wireguard / linux-arm64
          - wireguard / linux-armv7
          - wg-util / linux-amd64
          - wg-util / linux-arm64
          - wg-util / linux-armv7
      upstream_ref:
        description: Optional branch, tag, or commit; nginx release X.Y.Z (blank uses default/latest stable)
        required: false
        type: string
      mupdf_ref:
        description: Optional MuPDF revision when building Librera
        required: false
        type: string
      prepare_only:
        description: Fetch upstream and check patches without compiling (useful for updating patches)
        required: true
        default: false
        type: boolean
      publish_release:
        description: Publish GitHub Release after build succeeds (manual opt-in)
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      tool: ${{ steps.select.outputs.tool }}
      target: ${{ steps.select.outputs.target }}
    # Keep environment-scoped Android signing secrets and approval rules,
    # but do not record compilation jobs as deployments.
    environment:
      name: ${{ (startsWith(inputs.build, 'librera / ') || startsWith(inputs.build, 'cryptomator / ')) && !inputs.prepare_only && 'android-signing' || 'build' }}
      deployment: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve selected tool and target
        id: select
        shell: bash
        env:
          REQUESTED_BUILD: ${{ inputs.build }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_BUILD" == *' / '* ]] || { echo "Invalid tool/target selection" >&2; exit 2; }
          tool="${REQUESTED_BUILD%% / *}"
          target="${REQUESTED_BUILD#* / }"
          [[ "$tool" == 'John the Ripper' ]] && tool=john
          [[ "$tool" =~ ^[a-z0-9-]+$ && "$target" =~ ^[a-z0-9-]+$ ]] || exit 2
          [[ -r "tools/$tool/tool.conf" ]] || { echo "Unknown tool: $tool" >&2; exit 2; }
          TARGETS=
          source "tools/$tool/tool.conf"
          [[ " $TARGETS " == *" $target "* ]] || { echo "Unsupported target $target for $tool" >&2; exit 2; }
          echo "tool=$tool" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Verify recipe and trigger structure
        run: bash scripts/test.sh

      # Native builds reuse GitHub's Ubuntu image; install only what that tool needs.
      - name: Install native build dependencies
        if: ${{ !inputs.prepare_only && (steps.select.outputs.tool == 'busybox' || steps.select.outputs.tool == 'john' || (steps.select.outputs.tool == 'mupdf' && steps.select.outputs.target == 'linux-amd64')) }}
        env:
          SELECTED_TOOL: ${{ steps.select.outputs.tool }}
        shell: bash
        run: |
          set -euo pipefail
          case "$SELECTED_TOOL" in
            busybox)
              packages=(gcc-mingw-w64-x86-64 make)
              ;;
            john)
              packages=(build-essential autoconf automake pkg-config libssl-dev
                        zlib1g-dev libbz2-dev libgmp-dev)
              ;;
            mupdf)
              packages=(build-essential pkg-config libssl-dev zlib1g-dev)
              ;;
          esac
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"

      - uses: actions/setup-go@v5
        if: ${{ !inputs.prepare_only && (steps.select.outputs.tool == 'wireguard' || steps.select.outputs.tool == 'wg-util') }}
        with:
          go-version: stable
          cache: false

      - name: Set up Vaultwarden Rust and Zig tools
        if: ${{ !inputs.prepare_only && steps.select.outputs.tool == 'vaultwarden' && (steps.select.outputs.target == 'entware-aarch64' || steps.select.outputs.target == 'entware-armv7') }}
        shell: bash
        run: |
          set -euo pipefail
          # The source's rust-toolchain.toml chooses the active Rust release.
          # Install the target only after checkout, inside tools/vaultwarden/build.sh.
          python3 -m pip install --user --break-system-packages ziglang==0.17.1
          cargo install cargo-zigbuild --version 0.24.1 --locked
          python3 -m ziglang version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Keys are created on the runner only. The Android image contains no secrets.
      - name: Prepare Android signing key
        if: ${{ !inputs.prepare_only && (steps.select.outputs.tool == 'cryptomator' || steps.select.outputs.tool == 'librera') }}
        shell: bash
        env:
          SELECTED_TOOL: ${{ steps.select.outputs.tool }}
          LIBRERA_KEYSTORE_BASE64: ${{ secrets.LIBRERA_KEYSTORE_BASE64 }}
          LIBRERA_STORE_PASSWORD: ${{ secrets.LIBRERA_STORE_PASSWORD }}
          LIBRERA_KEY_ALIAS: ${{ secrets.LIBRERA_KEY_ALIAS }}
          LIBRERA_KEY_PASSWORD: ${{ secrets.LIBRERA_KEY_PASSWORD }}
          CRYPTOMATOR_KEYSTORE_BASE64: ${{ secrets.CRYPTOMATOR_KEYSTORE_BASE64 }}
          CRYPTOMATOR_STORE_PASSWORD: ${{ secrets.CRYPTOMATOR_STORE_PASSWORD }}
          CRYPTOMATOR_KEY_ALIAS: ${{ secrets.CRYPTOMATOR_KEY_ALIAS }}
          CRYPTOMATOR_KEY_PASSWORD: ${{ secrets.CRYPTOMATOR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          case "$SELECTED_TOOL" in
            librera)
              encoded="$LIBRERA_KEYSTORE_BASE64"
              store_pass="$LIBRERA_STORE_PASSWORD"
              alias="$LIBRERA_KEY_ALIAS"
              key_pass="$LIBRERA_KEY_PASSWORD"
              ;;
            cryptomator)
              encoded="$CRYPTOMATOR_KEYSTORE_BASE64"
              store_pass="$CRYPTOMATOR_STORE_PASSWORD"
              alias="$CRYPTOMATOR_KEY_ALIAS"
              key_pass="$CRYPTOMATOR_KEY_PASSWORD"
              ;;
          esac
          [[ -n "$encoded" && -n "$store_pass" && -n "$alias" && -n "$key_pass" ]] || {
            echo "::error::Missing Android signing secrets; see docs/android-signing.md" >&2
            exit 1
          }
          umask 077
          printf '%s' "$encoded" | base64 --decode > "$RUNNER_TEMP/release.p12"
          [[ -s "$RUNNER_TEMP/release.p12" ]] || exit 1
          {
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.p12"
            echo "RELEASE_STORE_PASSWORD=$store_pass"
            echo "RELEASE_KEY_ALIAS=$alias"
            echo "RELEASE_KEY_PASSWORD=$key_pass"
            echo "ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD=$store_pass"
            echo "ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS=$alias"
            echo "ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD=$key_pass"
          } >> "$GITHUB_ENV"

      - name: Log in to GHCR for reusable builders
        if: ${{ !inputs.prepare_only && (steps.select.outputs.tool == 'nginx' || steps.select.outputs.tool == 'btop' || steps.select.outputs.tool == 'librera' || steps.select.outputs.tool == 'cryptomator' || (steps.select.outputs.tool == 'mupdf' && steps.select.outputs.target == 'android-arm64')) }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build from upstream and optional patch
        shell: bash
        env:
          TOOLBOX_MUPDF_REF: ${{ inputs.mupdf_ref }}
          TOOLBOX_JOBS: '4'
          TOOLBOX_PREPARE_ONLY: ${{ inputs.prepare_only && '1' || '0' }}
          SELECTED_TOOL: ${{ steps.select.outputs.tool }}
          SELECTED_TARGET: ${{ steps.select.outputs.target }}
          SELECTED_REF: ${{ inputs.upstream_ref }}
        run: bash scripts/run.sh "$SELECTED_TOOL" "$SELECTED_TARGET" "$SELECTED_REF"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: toolbox-${{ steps.select.outputs.tool }}-${{ steps.select.outputs.target }}-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    if: ${{ inputs.publish_release && !inputs.prepare_only }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: toolbox-${{ needs.build.outputs.tool }}-${{ needs.build.outputs.target }}-${{ github.run_id }}
          path: dist/
      - name: Publish this manually selected build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="toolbox-${{ needs.build.outputs.tool }}-${{ needs.build.outputs.target }}-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          tar -C dist -czf "$RUNNER_TEMP/$tag.tar.gz" .
          mapfile -d '' -t ipks < <(find dist -type f -name '*.ipk' -print0)
          gh release create "$tag" "$RUNNER_TEMP/$tag.tar.gz" "${ipks[@]}" \
            --title "$tag" --notes "Manually requested upstream build. See build-info.txt for source commits and patch checksums. Validate on target before deploying." \
            --latest=false --target "$GITHUB_SHA"
