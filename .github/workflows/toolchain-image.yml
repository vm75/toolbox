name: Build Entware toolchain image
# Deliberately manual-only: this publishes GHCR image only when requested.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Toolchain image tag
        required: true
        default: latest
        type: string

permissions:
  contents: read
  packages: write

jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Entware builder
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_.-]+$ ]] || exit 2
          image="ghcr.io/${GITHUB_REPOSITORY,,}/entware-aarch64-builder:$IMAGE_TAG"
          docker build -f tools/nginx/Dockerfile --build-arg JOBS=4 -t "$image" .
          docker push "$image"
