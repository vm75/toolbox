name: Build toolbox images
run-name: "Builder ${{ inputs.builder }}${{ inputs.tag && format(' / {0}', inputs.tag) || '' }}"
# Explicitly manual: image publication never runs on push, tag or a schedule.
on:
  workflow_dispatch:
    inputs:
      builder:
        description: Builder environment to publish
        required: true
        type: choice
        options:
          - entware-aarch64
          - entware-armv7
          - android
      tag:
        description: Optional image tag (default v2, v1 or ndk-r27d)
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Free disk for Entware toolchain
        if: ${{ inputs.builder == 'entware-aarch64' }}
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push selected builder
        shell: bash
        env:
          BUILDER: ${{ inputs.builder }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$BUILDER" in
            entware-aarch64) default_tag=v2 ;;
            entware-armv7) default_tag=v1 ;;
            android) default_tag=ndk-r27d ;;
            *) echo "Unknown builder: $BUILDER" >&2; exit 2 ;;
          esac
          tag="${REQUESTED_TAG:-$default_tag}"
          [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || {
            echo "Invalid image tag" >&2
            exit 2
          }
          image="ghcr.io/${GITHUB_REPOSITORY,,}/$BUILDER:$tag"
          docker build --platform linux/amd64 --progress plain \
            --build-arg JOBS=4 -f "images/$BUILDER/Dockerfile" \
            -t "$image" .
          docker push "$image"
          echo "Published $image"
